name: Render Video

on:
  repository_dispatch:
    types: [render-job]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install requests

      - name: Run render job
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          BACKGROUND_VIDEO_URL: ${{ github.event.client_payload.background_video_url }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url }}
          CAPTIONS_JSON: ${{ toJson(github.event.client_payload.captions) }}
          INTRO_CARD_JSON: ${{ toJson(github.event.client_payload.intro_card) }}
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url }}
          RENDER_WORKER_SECRET: ${{ secrets.RENDER_WORKER_SECRET }}
        run: python3 render.py

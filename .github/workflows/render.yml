name: Render Video

on:
  repository_dispatch:
    types: [render-job]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install real Chrome (H.264 support)
        run: npx playwright install --with-deps chrome

      - name: Run render job
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          BACKGROUND_VIDEO_URL: ${{ github.event.client_payload.background_video_url }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url }}
          SENTENCES_JSON: ${{ toJson(github.event.client_payload.sentences) }}
          IS_ENGLISH: ${{ github.event.client_payload.is_english }}
          CAPTION_STYLE: ${{ github.event.client_payload.caption_style }}
          INTRO_CARD_JSON: ${{ toJson(github.event.client_payload.intro_card) }}
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url }}
          RENDER_WORKER_SECRET: ${{ secrets.RENDER_WORKER_SECRET }}
        run: node render-job.mjs
